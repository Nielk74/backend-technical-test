name: Ruby CI

on:
  push:
    branches:
      - master
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    name: Ruby ${{ matrix.ruby }}
    strategy:
      matrix:
        ruby:
          - '3.3.6'

    steps:
      - uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
          working-directory: file_converter

      - name: Install dependencies
        run: |
          cd file_converter
          bundle install

      - name: Run linting (Rubocop)
        run: |
          cd file_converter
          bundle exec rubocop

      - name: Run tests (RSpec)
        run: |
          cd file_converter
          bundle exec rspec
